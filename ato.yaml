requires-atopile: 0.12.4

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: main.ato:App
    hide_designators: true
    # exclude_checks: [PCB.requires_drc_check]
    targets:
      - 2d-image
      - 3d-image
      - mfg-data
      - manifest
      - variable-report
      - bom
      - i2c-tree

  switch_mount:
    entry: modules/switches.ato:KailhLowProfileSwitch_driver
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  led:
    entry: modules/leds.ato:WorldsemiWS2812BMiniTopDown
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  led_side:
    entry: modules/leds.ato:WorldsemiWS2812B4020Side
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

dependencies:
  - type: registry
    identifier: atopile/raspberry-rp2040
    release: 0.2.5
  - type: registry
    identifier: atopile/usb-connectors
    release: 0.3.1
  - type: registry
    identifier: ruben-iteng/ldos
    release: 0.2.3
  - type: registry
    identifier: atopile/logos
    release: 0.1.3
