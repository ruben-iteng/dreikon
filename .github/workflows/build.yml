# This workflow is used to build the hardware designed in atopile
# It will create an artifact containing all the build files
# It is triggered by push, pull_request, or manual workflow_dispatch

name: Build hardware

on:
  push:
    branches:
      - main
    paths:
      - "**/*.ato"
      - "ato.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "**/*.ato"
      - "ato.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip all jobs if PR is in draft
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: ato sync
      - run: ato build --frozen
        id: build
        continue-on-error: true

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

      - name: Check build status
        if: steps.build.outcome == 'failure'
        run: exit 1
